services:
  quantum-gates:
    image: nginx:alpine
    container_name: quantum-gates
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.quantum-gates.rule=Host(`quantum-gates.aichargeworks.com`)"
      - "traefik.http.routers.quantum-gates.entrypoints=web"
      - "traefik.http.services.quantum-gates.loadbalancer.server.port=80"
    networks:
      - traefik-net
    restart: unless-stopped

networks:
  traefik-net:
    external: true
